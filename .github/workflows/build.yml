name: Test and publish Downrange
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'LICENSE']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: downrange-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js && node --check app/static/sw.js
      - run: bash -n scripts/install-unraid-local.sh && bash -n scripts/install-unraid-registry.sh && sh -n scripts/entrypoint.sh
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package and version
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          VERSION=$(python3 -c 'from app import __version__; print(__version__)')
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "Tag and app version must match" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build an image for runtime smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: downrange-ci:test
          build-args: VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check startup, data permissions, and restart persistence
        shell: bash
        run: bash scripts/smoke-docker.sh downrange-ci:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:sha-${{ github.sha }}
          build-args: VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
