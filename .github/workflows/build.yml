name: Test and publish Downrange
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'LICENSE']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: downrange-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt playwright==1.57.0
      - run: python -m pytest -q
      - run: for f in app/static/*.js; do node --check "$f"; done
      - run: node tests/test_timeline.cjs && node tests/test_observer.cjs && node tests/test_v1.cjs
      - run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Install isolated browser test runtime
        run: python -m playwright install --with-deps chromium
      - name: Exercise application and horizon settings on desktop and phone
        run: python scripts/browser-smoke.py
      - name: Exercise observer perspective and shared flight clock
        run: python scripts/observer-browser-smoke.py
      - name: Exercise service-worker install and offline-shell privacy
        run: python scripts/pwa-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-regression
          path: browser-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Archive tracked source for reproducibility
        run: git archive --format=zip --output=/tmp/downrange-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: tested-source
          path: /tmp/downrange-source.zip
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package and version
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          VERSION=$(python3 -c 'from app import __version__; print(__version__)')
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "Tag and app version must match" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build once for runtime and upgrade testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: downrange-ci:test
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check startup, data permissions and restart persistence
        run: bash scripts/smoke-docker.sh downrange-ci:test
      - name: Verify upgrade from 0.2 with isolated appdata
        run: bash scripts/smoke-upgrade.sh downrange-ci:test ghcr.io/spikked27/downrange:0.2.0-alpha.1
      - name: Verify upgrade from 0.3.0 with isolated appdata
        run: bash scripts/smoke-upgrade.sh downrange-ci:test ghcr.io/spikked27/downrange:0.3.0-alpha.2
      - name: Verify upgrade from 0.3.1 with isolated appdata
        run: bash scripts/smoke-upgrade.sh downrange-ci:test ghcr.io/spikked27/downrange:0.3.1-alpha.1
      - name: Verify upgrade from 0.3.2 with isolated appdata
        run: bash scripts/smoke-upgrade.sh downrange-ci:test ghcr.io/spikked27/downrange:0.3.2-alpha.1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image and advance GUI update channel
        id: publish
        shell: bash
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          docker tag downrange-ci:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Version tag already exists; retained. Bump app version for a new release."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker tag downrange-ci:test "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          CURRENT_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$GITHUB_REF" == refs/heads/main && "$CURRENT_MAIN" == "$GITHUB_SHA" ]]; then
            docker tag downrange-ci:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not current main; latest channel left unchanged."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify anonymous GUI-channel pull and published app version
        if: steps.publish.outputs.promoted == 'true'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=$(mktemp -d)
          trap 'rm -rf "$CONFIG"' EXIT
          DOCKER_CONFIG="$CONFIG" docker pull "$IMAGE:latest"
          ACTUAL=$(docker run --rm --network none --entrypoint python "$IMAGE:latest" -c 'from app import __version__; print(__version__)')
          test "$ACTUAL" = "$VERSION"
          test "$(docker image inspect "$IMAGE:latest" --format '{{.Id}}')" = "$(docker image inspect downrange-ci:test --format '{{.Id}}')"
          echo "Published $IMAGE:latest ($ACTUAL); anonymous pull and image identity verified." >> "$GITHUB_STEP_SUMMARY"
