name: Prepare and verify v1 alpha candidate
on:
  push:
    branches: [work/v1-alpha]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/work/v1-alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt playwright==1.57.0
      - run: python -m pytest -q
      - run: for f in app/static/*.js; do node --check "$f"; done
      - run: node tests/test_timeline.cjs && node tests/test_observer.cjs && node tests/test_v1.cjs
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser-smoke.py
      - run: python scripts/observer-browser-smoke.py
      - name: Test actual service worker and offline shell
        run: python scripts/pwa-smoke.py
      - name: Audit live historical analogue data
        run: python scripts/check-history-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-synthetic-ui-and-source-audit
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
