services:
  downrange:
    build: .
    image: downrange-local:0.2.0-alpha.1
    container_name: Downrange-Local
    init: true
    ports:
      - "${WEB_PORT:-8097}:8097"
    volumes:
      - "${APPDATA:-./data}:/data"
    environment:
      TZ: "${TZ:-America/New_York}"
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      REGISTRATION_CODE: "${REGISTRATION_CODE:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      LL2_API_KEY: "${LL2_API_KEY:-}"
      POLL_SECONDS: "600"
      DEMO_MODE: "false"
    restart: unless-stopped
